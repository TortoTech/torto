[workspace]
members = [
    "apps/desktop",
    "apps/inspect",
    "crates/formats",
    "crates/html",
    "crates/layout",
    "crates/macos-open-file",
    "crates/math",
    "crates/publication",
    "crates/reader",
    "crates/renderer",
    "crates/windows-window-background",
]
exclude = [
    "third_party/egui",
    "third_party/egui-wgpu",
    "third_party/egui_commonmark",
    "third_party/egui_commonmark_backend",
]
resolver = "3"

[workspace.package]
version = "0.4.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/TortoTech/torto"
homepage = "https://github.com/TortoTech/torto"
authors = ["TortoTech"]

[workspace.dependencies]
anyrender = "0.13.0"
atomicwrites = "0.4.4"
base64 = "0.22.1"
bytemuck = "1.25.2"
bytes = "1.12.1"
crc32fast = "1.5.0"
directories = "6.0.0"
egui = "0.36.1"
egui_commonmark = { version = "0.25.0", features = ["embedded_image"] }
egui_commonmark_backend = "0.25.0"
egui_extras = { version = "0.36.1", features = ["image"] }
egui-wgpu = { version = "0.36.1", default-features = false }
egui-winit = { version = "0.36.1", default-features = false, features = ["clipboard", "links"] }
encoding_rs = "0.8.35"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
fontdb = "0.23.0"
hayro = "0.7.1"
image = { version = "=0.25.6", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
icu_segmenter = "2.2.0"
jsonrepair-rs = "0.2.1"
kurbo = "0.13.1"
libchm = "0.2.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
parley = { version = "0.11.1", features = ["complex-scripts"] }
peniko = "0.6.1"
percent-encoding = "2.3.2"
pollster = "0.4.0"
pulldown-cmark = "0.13.0"
quick-xml = { version = "0.41.0", features = ["encoding", "escape-html"] }
read-fonts = "0.41.0"
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls"] }
resvg = "0.47.0"
rfd = "0.17.2"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
scraper = { version = "0.27.0", default-features = false }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sentencex = "=0.1.30"
sha2 = "0.10.9"
sys-locale = "0.3.2"
thiserror = "2.0.19"
tracing = "0.1.44"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.13.3"
unicode-script = "0.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
vello = { version = "0.10.0", default-features = false, features = ["wgpu"] }
wgpu = { version = "29.0.3", default-features = false, features = ["std", "parking_lot", "wgsl"] }
winit = "0.30.13"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev]
debug = 0
incremental = true
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.perf]
inherits = "release"
debug = 1
strip = "none"

[patch.crates-io]
egui = { path = "third_party/egui" }
egui-wgpu = { path = "third_party/egui-wgpu" }
egui_commonmark = { path = "third_party/egui_commonmark" }
egui_commonmark_backend = { path = "third_party/egui_commonmark_backend" }
