[package]
edition = "2024"
rust-version = "1.95"
name = "egui"
version = "0.37.0"
authors = ["Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
build = false
include = [
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "**/*.rs",
    "Cargo.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "An easy-to-use immediate mode GUI that runs on both web and native"
homepage = "https://github.com/emilk/egui"
readme = "README.md"
keywords = [
    "gui",
    "imgui",
    "immediate",
    "portable",
    "gamedev",
]
categories = [
    "gui",
    "game-development",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/emilk/egui"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[features]
_override_unity = ["epaint/_override_unity"]
bytemuck = ["epaint/bytemuck"]
callstack = ["dep:backtrace"]
cint = ["epaint/cint"]
color-hex = ["epaint/color-hex"]
default = []
default_fonts = ["epaint/default_fonts"]
experimental = []
mint = ["epaint/mint"]
monochrome_emoji_fonts = [
    "default_fonts",
    "epaint/monochrome_emoji_fonts",
]
persistence = [
    "serde",
    "epaint/serde",
    "ron",
]
rayon = ["epaint/rayon"]
serde = [
    "dep:serde",
    "epaint/serde",
    "accesskit/serde",
]
unity = ["epaint/unity"]
web_file = ["dep:web-sys"]

[lib]
name = "egui"
path = "src/lib.rs"

[[test]]
name = "drop_zone"
path = "tests/drop_zone.rs"

[dependencies.accesskit]
version = "0.25.0"

[dependencies.ahash]
version = "0.8.12"
features = [
    "no-rng",
    "std",
]
default-features = false

[dependencies.backtrace]
version = "0.3.76"
optional = true

[dependencies.bitflags]
version = "2.13"

[dependencies.document-features]
version = "0.2.12"
optional = true

[dependencies.emath]
version = "0.37.0"
default-features = false

[dependencies.epaint]
version = "0.37.0"
default-features = false

[dependencies.itertools]
version = "0.15.0"

[dependencies.log]
version = "0.4.34"
features = ["std"]

[dependencies.nohash-hasher]
version = "0.2.0"

[dependencies.profiling]
version = "1.0"
default-features = false

[dependencies.ron]
version = "0.12.2"
optional = true

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "derive",
    "rc",
]
optional = true

[dependencies.smallvec]
version = "1.16"

[dependencies.unicode-segmentation]
version = "1.13"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.103"
features = ["File"]
optional = true

