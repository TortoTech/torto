name: Build macOS installers

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-installer:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64

    env:
      CARGO_BUNDLE_VERSION: "0.11.0"
      CARGO_INCREMENTAL: "0"
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-macos-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-macos-

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Add Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Validate tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$({ cargo metadata --no-deps --format-version 1; } | jq -r '.packages[] | select(.name == "rebook-desktop") | .version')"

          if [[ -z "$package_version" || "$package_version" == "null" ]]; then
            echo "Could not find the rebook-desktop package in Cargo metadata." >&2
            exit 1
          fi

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match rebook-desktop version '$package_version'. Use tag 'v$package_version'." >&2
            exit 1
          fi

          echo "TORTO_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: cargo test --locked --workspace --target "${{ matrix.target }}"

      - name: Reclaim test build space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleaning test artifacts:"
          df -h .
          cargo clean --target "${{ matrix.target }}"
          echo "Disk usage after cleaning test artifacts:"
          df -h .

      - name: Restore cargo-bundle
        id: cargo-bundle-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-bundle
          key: cargo-bundle-macos-${{ matrix.arch }}-${{ env.CARGO_BUNDLE_VERSION }}

      - name: Install cargo-bundle
        if: steps.cargo-bundle-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-bundle --version "$CARGO_BUNDLE_VERSION" --locked

      - name: Build and verify application bundle
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail

          cargo build --locked --release --package rebook-desktop --target "$TARGET"
          CARGO_BUNDLE_SKIP_BUILD=1 cargo bundle \
            --release \
            --package rebook-desktop \
            --format osx \
            --target "$TARGET"

          app_bundle="target/$TARGET/release/bundle/osx/Torto.app"
          executable="$app_bundle/Contents/MacOS/torto"
          if [[ ! -x "$executable" ]]; then
            echo "Bundled executable is missing: $executable" >&2
            exit 1
          fi

          file "$executable" | grep -F "$ARCH"
          plutil -lint "$app_bundle/Contents/Info.plist"
          codesign --force --deep --sign - "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          minimum_os=$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$app_bundle/Contents/Info.plist")
          test "$minimum_os" = "15.0"
          otool -L "$executable"

      - name: Check application startup
        if: "!startsWith(github.ref, 'refs/tags/')"
        timeout-minutes: 10
        run: node scripts/smoke/macos.mjs "target/${{ matrix.target }}/release/bundle/osx/Torto.app" "$RUNNER_TEMP/torto-smoke"

      - name: Build and verify DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="target/$TARGET/release/bundle/osx/Torto.app"

          staging_dir="dist/dmg-root"
          dmg_name="Torto-$TORTO_VERSION-macos-$ARCH.dmg"
          dmg_path="dist/$dmg_name"
          mkdir -p "$staging_dir"
          ditto "$app_bundle" "$staging_dir/Torto.app"
          ln -s /Applications "$staging_dir/Applications"

          echo "Disk usage before cleaning release artifacts:"
          df -h .
          cargo clean --release --target "$TARGET"
          echo "Disk usage before creating DMG:"
          df -h .

          # hdiutil can underestimate the filesystem space needed by -srcfolder,
          # especially after accounting for per-file metadata and allocation blocks.
          # Add proportional and fixed headroom; UDZO compresses the unused capacity.
          dmg_source_kib="$(du -sk "$staging_dir" | awk '{print $1}')"
          if ! [[ "$dmg_source_kib" =~ ^[0-9]+$ ]] || [[ "$dmg_source_kib" -le 0 ]]; then
            echo "Unable to determine DMG staging size: $dmg_source_kib" >&2
            exit 1
          fi
          dmg_capacity_kib=$((dmg_source_kib + dmg_source_kib / 2 + 262144))
          echo "DMG staging size: ${dmg_source_kib} KiB; filesystem capacity: ${dmg_capacity_kib} KiB"

          hdiutil create \
            -volname "Torto" \
            -srcfolder "$staging_dir" \
            -size "${dmg_capacity_kib}k" \
            -ov \
            -format UDZO \
            "$dmg_path"
          hdiutil verify "$dmg_path"
          (cd dist && shasum -a 256 "$dmg_name" > "$dmg_name.sha256")

      - name: Check startup from final DMG
        if: startsWith(github.ref, 'refs/tags/')
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mount_dir="$RUNNER_TEMP/torto-dmg"
          install_dir="$RUNNER_TEMP/torto-install"
          mkdir -p "$mount_dir" "$install_dir"
          hdiutil attach "dist/Torto-$TORTO_VERSION-macos-${{ matrix.arch }}.dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          trap 'hdiutil detach "$mount_dir" || true' EXIT
          ditto "$mount_dir/Torto.app" "$install_dir/Torto.app"
          codesign --verify --deep --strict --verbose=2 "$install_dir/Torto.app"
          node scripts/smoke/macos.mjs "$install_dir/Torto.app" "$RUNNER_TEMP/torto-smoke"

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-startup-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/torto-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Upload workflow artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: Torto-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  publish-macos-installers:
    name: Publish macOS installers
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-macos-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Torto-*-macos-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.sha256
          fail_on_unmatched_files: true
          # Release notes are created once by the publishing flow. Asset jobs
          # must not append a second generated changelog to an existing release.
