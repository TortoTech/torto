name: iOS

on:
  pull_request:
    branches: [main]
    paths: &ios_paths
      - 'apps/ios/**'
      - 'apps/android/app/src/main/res/drawable/**'
      - 'apps/android/third_party/material-symbols/**'
      - 'assets/**'
      - 'crates/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'scripts/build-ios.sh'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths: *ios_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS device and simulator
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-ios-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-ios-

      - name: Prepare Xcode and Rust targets
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          if ! command -v xcodegen >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Generate shared core and Xcode project
        run: bash scripts/build-ios.sh debug

      - name: Build device and simulator apps
        run: |
          set -euo pipefail
          xcodebuild -project apps/ios/Torto.xcodeproj -scheme Torto -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/torto-ios-device" \
            CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apps/ios/Torto.xcodeproj -scheme Torto -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/torto-ios-simulator" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Verify bundles and package simulator preview
        id: package
        run: |
          set -euo pipefail
          device="$RUNNER_TEMP/torto-ios-device/Build/Products/debug-iphoneos/Torto.app"
          simulator="$RUNNER_TEMP/torto-ios-simulator/Build/Products/debug-iphonesimulator/Torto.app"
          for app in "$device" "$simulator"; do
            test -x "$app/Torto"
            test "$(lipo -archs "$app/Torto")" = arm64
            plutil -lint "$app/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")" = 18.0
          done
          xcrun vtool -show-build "$device/Torto" | grep -E 'platform[[:space:]]+IOS$'
          xcrun vtool -show-build "$simulator/Torto" | grep -E 'platform[[:space:]]+IOSSIMULATOR$'
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$simulator/Info.plist")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="Torto-$version-ios-simulator-arm64.tar.gz"
          mkdir -p "$RUNNER_TEMP/torto-ios-artifact"
          tar -czf "$RUNNER_TEMP/torto-ios-artifact/$archive" -C "$(dirname "$simulator")" Torto.app
          (cd "$RUNNER_TEMP/torto-ios-artifact" && shasum -a 256 "$archive" > "$archive.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload simulator preview
        uses: actions/upload-artifact@v7
        with:
          name: Torto-${{ steps.package.outputs.version }}-ios-simulator-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/torto-ios-artifact/
          if-no-files-found: error
          retention-days: 14
