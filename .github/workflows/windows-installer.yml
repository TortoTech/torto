name: Build Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-installer:
    name: Build Windows MSI
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CARGO_WIX_VERSION: "0.3.9"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Cargo registry cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-windows-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-windows-

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.16.0"

      - name: Validate tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $tagVersion = $tag.TrimStart("v")
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "rebook-desktop" }

          if (-not $package) {
            throw "Could not find the rebook-desktop package in Cargo metadata."
          }

          if ($tagVersion -ne $package.version) {
            throw "Tag '$tag' does not match rebook-desktop version '$($package.version)'. Use a tag such as 'v$($package.version)'."
          }

          "TORTO_VERSION=$($package.version)" >> $env:GITHUB_ENV
          "version=$($package.version)" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Restore cargo-wix
        id: cargo-wix-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-wix.exe
          key: cargo-wix-windows-${{ env.CARGO_WIX_VERSION }}

      - name: Install cargo-wix
        if: steps.cargo-wix-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-wix --version $env:CARGO_WIX_VERSION --locked

      - name: Warm release build cache
        if: github.ref == 'refs/heads/main'
        run: cargo build --locked --release --package rebook-desktop

      - name: Build MSI installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo wix `
            --package rebook-desktop `
            --nocapture `
            --output "dist\Torto-$env:TORTO_VERSION-x86_64.msi"

      - name: Build Microsoft Store MSIX package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: .\scripts\build-msix.ps1 -SkipBuild -OutputDirectory dist

      - name: Upload workflow artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: Torto-${{ steps.version.outputs.version }}-windows-x86_64
          path: |
            dist/*.msi
            dist/*.msix
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.msi
          fail_on_unmatched_files: true
          # Release notes are created once by the publishing flow. Asset jobs
          # must not append a second generated changelog to an existing release.
