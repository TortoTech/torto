[package]
name = "rebook-math"
description = "Lightweight SVG math rendering for Torto chat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
ratex-layout.workspace = true
ratex-parser.workspace = true
ratex-svg.workspace = true
ratex-types.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# RaTeX uses rust-embed for its KaTeX glyphs. Debug APKs must embed them too:
# the build host's registry/font paths do not exist on the device.
rust-embed = { version = "8.12.0", features = ["debug-embed"] }

[lints]
workspace = true
