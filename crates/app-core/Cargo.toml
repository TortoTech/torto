[package]
name = "rebook-app-core"
description = "Shared Torto application services, independent of native UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
rebook-layout = { path = "../layout" }
rebook-reader = { path = "../reader" }
rebook-renderer = { path = "../renderer" }
rebook-math = { path = "../math" }
rebook-html = { path = "../html" }
base64.workspace = true
ring = "0.17.14"
blake3.workspace = true
bytes.workspace = true
directories.workspace = true
image.workspace = true
resvg.workspace = true
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
jsonrepair-rs.workspace = true
jsonschema = { version = "0.46", default-features = false }
rig-core = { version = "=0.44.0", default-features = false }
rig-reqwest = { version = "=0.44.0", default-features = false }
percent-encoding.workspace = true
pulldown-cmark.workspace = true
quick-xml.workspace = true
rusqlite.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
chrono = "0.4"
uuid.workspace = true
zip.workspace = true

rebook-formats = { path = "../formats" }
rebook-publication = { path = "../publication" }
atomicwrites.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
tracing.workspace = true
arc-swap = "1.9.2"
peniko.workspace = true
fontdb.workspace = true
skrifa = "0.48.0"
tokio.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
anyrender.workspace = true
kurbo.workspace = true
anyrender_vello_cpu = { version = "0.18.0", default-features = false }
rcgen = "0.14.10"

[lints]
workspace = true
