[package]
name = "rebook-desktop"
description = "Torto native e-book reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "torto"
path = "src/main.rs"

[package.metadata.bundle]
name = "Torto"
identifier = "io.github.l-chris.torto"
icon = [
    "assets/macos/torto-16.png",
    "assets/macos/torto-32.png",
    "assets/macos/torto-64.png",
    "assets/macos/torto-128.png",
    "assets/macos/torto-256.png",
    "assets/macos/torto-512.png",
    "assets/macos/torto-512@2x.png",
]
category = "public.app-category.reference"
short_description = "Torto native e-book reader"
long_description = "A native desktop reader for PDF, EPUB, MOBI, AZW3, FB2, CBZ, and CHM books."
osx_minimum_system_version = "12.0"
osx_info_plist_exts = ["assets/macos/document-types.plist"]

[dependencies]
anyrender.workspace = true
atomicwrites.workspace = true
base64.workspace = true
bytemuck.workspace = true
bytes.workspace = true
directories.workspace = true
egui.workspace = true
egui_commonmark.workspace = true
egui_commonmark_backend.workspace = true
egui_extras.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
fontdb.workspace = true
image.workspace = true
jsonrepair-rs.workspace = true
keyring.workspace = true
kurbo.workspace = true
mermaid-rs-renderer.workspace = true
peniko.workspace = true
percent-encoding.workspace = true
pollster.workspace = true
pulldown-cmark.workspace = true
quick-xml.workspace = true
regex.workspace = true
rebook-formats = { path = "../../crates/formats" }
rebook-html = { path = "../../crates/html" }
rebook-layout = { path = "../../crates/layout" }
rebook-math = { path = "../../crates/math" }
rebook-publication = { path = "../../crates/publication" }
rebook-reader = { path = "../../crates/reader" }
rebook-renderer = { path = "../../crates/renderer" }
reqwest.workspace = true
resvg.workspace = true
rfd.workspace = true
rusqlite.workspace = true
rebook-sqlite-vec-extension.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid.workspace = true
vello.workspace = true
wgpu.workspace = true
winit.workspace = true
zip.workspace = true

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12", "vulkan"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
rebook-macos-open-file = { path = "../../crates/macos-open-file" }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }
