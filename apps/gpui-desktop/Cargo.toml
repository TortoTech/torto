[package]
name = "rebook-gpui-desktop"
description = "Incremental GPUI desktop frontend for Torto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "torto-gpui"
path = "src/main.rs"

[dependencies]
gpui = { workspace = true, features = ["windows-manifest"] }
image.workspace = true
rebook-assistant = { path = "../../crates/assistant" }
rebook-formats = { path = "../../crates/formats" }
rebook-gpui-renderer = { path = "../../crates/gpui-renderer" }
rebook-layout = { path = "../../crates/layout" }
rebook-library = { path = "../../crates/library" }
rebook-publication = { path = "../../crates/publication" }
rebook-reader = { path = "../../crates/reader", default-features = false }
rebook-session = { path = "../../crates/session" }
rebook-sync = { path = "../../crates/sync" }
unicode-segmentation.workspace = true

[dev-dependencies]
zip.workspace = true

[lints]
workspace = true
